# Cloudflare Workers config for hyphosconsulting.com.
#
# Astro static output (`output: 'static'`) — all pages prerender to HTML in
# `dist/` at build time. The worker is a 5-line passthrough to the ASSETS
# binding (./src/worker.js); Workers requires a main script even when
# serving only static files.

name = "hyphos-consulting-website"
main = "./src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# D1 — entry storage for the golf tournament form at /golf. The worker handles
# POST /api/golf/entry and GET /api/golf/entries; everything else still falls
# through to ASSETS. See schema.sql and INFRASTRUCTURE.md.
#
# Create once:  npx wrangler d1 create hyphos-golf
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "hyphos-golf"
database_id = "9c111649-8d37-40b5-b538-fa7127a09af7"

# Domain (hyphosconsulting.com / www.hyphosconsulting.com) is configured in
# the Cloudflare dashboard: Workers & Pages → hyphos-consulting-website →
# Settings → Domains & Routes.
